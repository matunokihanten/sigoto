<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Markdown ドキュメントビューア</title>
  <!-- Markdownパーサー (marked) とシンタックスハイライト (highlight.js) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

  <style>
    :root {
      --ink: #2c2c2b;
      --muted: #7d7a75;
      --line: #e6e5e3;
      --surface: #f9f8f7;
      --blue: #2783de;
      --blueSoft: #e5f2fc;
      --green: #46a171;
      --orange: #d5803b;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #fff;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
      line-height: 1.6;
    }

    .wrap {
      max-width: 1200px;
      margin: auto;
      padding: 48px 28px 80px;
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: flex-start;
      margin-bottom: 28px;
    }

    h1 {
      font-size: 28px;
      line-height: 1.2;
      margin: 0 0 8px;
      letter-spacing: -.02em;
    }

    .sub {
      color: var(--muted);
      font-size: 14px;
    }

    .badge {
      background: var(--blueSoft);
      color: #1769b4;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    /* 統計パネル */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin: 22px 0 28px;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      background: var(--surface);
    }

    .stat b {
      display: block;
      font-size: 24px;
      line-height: 1.1;
      margin-bottom: 4px;
    }

    .stat span {
      color: var(--muted);
      font-size: 13px;
    }

    /* ツールバー */
    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 20px;
    }

    input[type="file"] {
      display: none;
    }

    .btn, button {
      font: inherit;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fff;
      height: 40px;
      padding: 0 16px;
      color: var(--ink);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: all .15s ease;
    }

    .btn:hover, button:hover {
      border-color: #bfc7d1;
      background: var(--surface);
    }

    .btn-primary {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue);
    }

    .btn-primary:hover {
      background: #1769b4;
      border-color: #1769b4;
    }

    /* メインレイアウト */
    .layout {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 24px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      overflow: hidden;
    }

    .panelHead {
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
    }

    .panelHead strong {
      font-size: 15px;
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
    }

    /* Markdown表示領域 */
    .md-content {
      padding: 32px;
      min-height: 450px;
      max-height: 75vh;
      overflow-y: auto;
    }

    /* ドラッグ＆ドロップ用エリア */
    .drop-zone {
      border: 2px dashed var(--line);
      border-radius: 12px;
      padding: 60px 20px;
      text-align: center;
      color: var(--muted);
      cursor: pointer;
      background: var(--surface);
      transition: background .2s, border-color .2s;
    }

    .drop-zone.dragover {
      background: var(--blueSoft);
      border-color: var(--blue);
    }

    /* タイポグラフィ・Markdownスタイル */
    .md-content h1 { font-size: 1.85em; border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-top: 24px; }
    .md-content h2 { font-size: 1.45em; border-bottom: 1px solid var(--line); padding-bottom: 6px; margin-top: 20px; }
    .md-content h3 { font-size: 1.2em; margin-top: 16px; }
    .md-content p { margin: 12px 0; }
    .md-content ul, .md-content ol { padding-left: 24px; margin: 12px 0; }
    .md-content li { margin: 4px 0; }
    .md-content blockquote {
      border-left: 4px solid var(--blue);
      margin: 16px 0;
      padding: 8px 16px;
      color: #555;
      background: var(--surface);
      border-radius: 0 8px 8px 0;
    }
    .md-content table {
      border-collapse: collapse;
      width: 100%;
      margin: 16px 0;
    }
    .md-content th, .md-content td {
      border: 1px solid var(--line);
      padding: 10px 14px;
      font-size: 14px;
    }
    .md-content th {
      background: var(--surface);
      font-weight: 600;
    }
    .md-content code {
      font-family: Consolas, Monaco, monospace;
      background: #f2f1ef;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.9em;
    }
    .md-content pre {
      background: #f6f8fa;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      overflow-x: auto;
    }
    .md-content pre code {
      background: transparent;
      padding: 0;
    }

    /* サイドバー */
    .side {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .sidebox {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      background: #fff;
    }

    .sidebox h2 {
      font-size: 15px;
      margin: 0 0 14px;
    }

    .toc-list {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 40vh;
      overflow-y: auto;
      font-size: 13px;
    }

    .toc-list li {
      margin: 6px 0;
    }

    .toc-list a {
      color: var(--ink);
      text-decoration: none;
      display: block;
      padding: 4px 8px;
      border-radius: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toc-list a:hover {
      background: var(--surface);
      color: var(--blue);
    }

    .toc-list .toc-h3 {
      padding-left: 16px;
      color: var(--muted);
    }

    .note {
      background: var(--surface);
      border-radius: 10px;
      padding: 12px 14px;
      color: #5f5b55;
      font-size: 13px;
    }

    @media (max-width: 820px) {
      .wrap { padding: 28px 16px 60px; }
      header { display: block; }
      .badge { display: inline-block; margin-top: 14px; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .layout { grid-template-columns: 1fr; }
      .md-content { max-height: none; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div>
        <h1>Markdown ドキュメントビューア</h1>
        <div class="sub">Markdown（.md）ファイルを読み込み、整理された見やすいレイアウトで表示します</div>
      </div>
      <div class="badge">ローカル完結型</div>
    </header>

    <!-- メトリクス情報 -->
    <section class="stats">
      <div class="stat"><b id="stat-words">0</b><span>文字数 (概算)</span></div>
      <div class="stat"><b id="stat-lines">0</b><span>行数</span></div>
      <div class="stat"><b id="stat-headers">0</b><span>見出し数</span></div>
      <div class="stat"><b id="stat-readtime">0 分</b><span>推定読了時間</span></div>
    </section>

    <!-- ツールバー -->
    <div class="toolbar">
      <label class="btn btn-primary" for="file-input">📂 MDファイルを開く</label>
      <input type="file" id="file-input" accept=".md,.markdown,.txt">
      <button id="btn-sample">サンプルを表示</button>
      <button id="btn-print">印刷 / PDF保存</button>
    </div>

    <!-- コンテンツ表示エリア -->
    <div class="layout">
      <section class="panel">
        <div class="panelHead">
          <strong id="doc-title">ドキュメントプレビュー</strong>
          <span class="hint" id="file-name">未選択</span>
        </div>
        <div class="md-content" id="viewer">
          <div class="drop-zone" id="drop-zone">
            ここに .md ファイルをドラッグ＆ドロップ<br>
            または上部の「MDファイルを開く」から選択
          </div>
        </div>
      </section>

      <!-- サイドバー -->
      <aside class="side">
        <section class="sidebox">
          <h2>目次 (TOC)</h2>
          <ul class="toc-list" id="toc">
            <li style="color: var(--muted);">見出しがありません</li>
          </ul>
        </section>

        <div class="note">
          ブラウザ内で完全に処理されるため、開いたファイルの内容が外部サーバーに送信されることはありません。
        </div>
      </aside>
    </div>
  </main>

  <script>
    // marked の初期設定 (コードハイライト対応)
    marked.setOptions({
      highlight: function(code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          return hljs.highlight(code, { language: lang }).value;
        }
        return hljs.highlightAuto(code).value;
      },
      breaks: true,
      gfm: true
    });

    const fileInput = document.getElementById('file-input');
    const viewer = document.getElementById('viewer');
    const dropZone = document.getElementById('drop-zone');
    const docTitle = document.getElementById('doc-title');
    const fileName = document.getElementById('file-name');
    const tocList = document.getElementById('toc');

    // 統計更新
    function updateStats(text) {
      const lines = text.split('\n').length;
      const cleanText = text.replace(/\s+/g, '');
      const words = cleanText.length;
      const headers = (text.match(/^#{1,6}\s+/gm) || []).length;
      const readTime = Math.ceil(words / 500); // 1分あたり約500文字換算

      document.getElementById('stat-words').textContent = words.toLocaleString();
      document.getElementById('stat-lines').textContent = lines.toLocaleString();
      document.getElementById('stat-headers').textContent = headers;
      document.getElementById('stat-readtime').textContent = `${readTime} 分`;
    }

    // 目次 (TOC) 生成
    function generateTOC() {
      tocList.innerHTML = '';
      const headers = viewer.querySelectorAll('h1, h2, h3');
      if (headers.length === 0) {
        tocList.innerHTML = '<li style="color: var(--muted);">見出しがありません</li>';
        return;
      }

      headers.forEach((h, index) => {
        const id = `heading-${index}`;
        h.id = id;

        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = `#${id}`;
        a.textContent = h.textContent;

        if (h.tagName === 'H3') a.classList.add('toc-h3');

        a.addEventListener('click', (e) => {
          e.preventDefault();
          h.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });

        li.appendChild(a);
        tocList.appendChild(li);
      });
    }

    // Markdown描画処理
    function renderMarkdown(content, name = 'ドキュメント') {
      viewer.innerHTML = marked.parse(content);
      fileName.textContent = name;
      docTitle.textContent = name.replace(/\.[^/.]+$/, "");
      updateStats(content);
      generateTOC();
    }

    // ファイル読込処理
    function handleFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        renderMarkdown(e.target.result, file.name);
      };
      reader.readAsText(file);
    }

    // ファイル選択イベント
    fileInput.addEventListener('change', (e) => {
      handleFile(e.target.files[0]);
    });

    // ドラッグ＆ドロップイベント
    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('drop', (e) => e.preventDefault());

    dropZone.addEventListener('dragover', () => dropZone.classList.add('dragover'));
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length > 0) {
        handleFile(e.dataTransfer.files[0]);
      }
    });

    // サンプル表示ボタン
    document.getElementById('btn-sample').addEventListener('click', () => {
      const sampleMD = `# プロジェクト概要
このドキュメントは、Markdownファイルを美しくレンダリングするためのビューアツールです。

## 主な機能
* **瞬時のパース**: 大きなファイルもスムーズにHTMLへ変換
* **目次の自動生成**: H1〜H3を検出し、右側のサイドバーにアンカーリンクを配置
* **コードブロックの装飾**: 言語別のシンタックスハイライトに対応

### サンプルコード
\`\`\`javascript
function calculateSum(a, b) {
  // 合計を返す
  return a + b;
}
console.log(calculateSum(10, 25));
\`\`\`

## テーブルサンプル
| 項目 | ステータス | 備考 |
| :--- | :---: | :--- |
| ドラッグ＆ドロップ | ✅ 対応 | ファイルを直接投入可能 |
| 目次追従 | ✅ 対応 | クリックで該当箇所へスクロール |
| 印刷・PDF出力 | ✅ 対応 | 印刷用レイアウトを維持 |

> このように、引用文やテーブル、チェックリストなども綺麗にスタイルが当たります。
`;
      renderMarkdown(sampleMD, 'サンプルドキュメント.md');
    });

    // 印刷 / PDF保存
    document.getElementById('btn-print').addEventListener('click', () => {
      window.print();
    });
  </script>
</body>
</html>
