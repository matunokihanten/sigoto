<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>構造エディタ ＆ 高機能Markdown IDE</title>
  
  <!-- ライブラリ群 -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github.min.css" id="hljs-theme-light">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css" id="hljs-theme-dark" disabled>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --bg-body: #f5f5f5; --bg-panel: #ffffff; --bg-toolbar: #f9f8f7;
      --text-main: #2c2c2b; --text-muted: #7d7a75; --border: #e6e5e3;
      --primary: #2783de; --primary-hover: #1769b4; --tab-bg: #eaeaea; --tab-active: #ffffff;
      --tree-hover: #def; --tree-line: #ccc;
    }
    body.dark-mode {
      --bg-body: #1e1e1e; --bg-panel: #252526; --bg-toolbar: #2d2d30;
      --text-main: #d4d4d4; --text-muted: #a0a0a0; --border: #3e3e42;
      --primary: #0e639c; --primary-hover: #1177bb; --tab-bg: #2d2d2d; --tab-active: #1e1e1e;
      --tree-hover: #37373d; --tree-line: #555;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg-body); color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
      transition: background 0.2s, color 0.2s;
    }

    /* ヘッダー */
    header {
      background: var(--bg-toolbar); padding: 10px 20px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
    }
    .header-left, .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    h1 { font-size: 18px; margin: 0; white-space: nowrap; }
    button, select {
      background: var(--bg-panel); color: var(--text-main); border: 1px solid var(--border);
      border-radius: 4px; padding: 6px 12px; font-size: 13px; cursor: pointer;
    }
    button:hover { background: var(--border); }
    .btn-primary { background: var(--primary); color: #fff; border: none; }
    .btn-primary:hover { background: var(--primary-hover); }

    /* メインレイアウト */
    .workspace { display: flex; flex: 1; overflow: hidden; }

    /* サイドバー (ツリー) */
    .sidebar {
      width: 320px; background: var(--bg-panel); border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
    }
    .tree-controls {
      padding: 10px; border-bottom: 1px solid var(--border); background: var(--bg-toolbar);
      display: flex; flex-wrap: wrap; gap: 4px;
    }
    .tree-controls button { padding: 4px 8px; font-size: 12px; }
    .tree-container { flex: 1; overflow-y: auto; padding: 10px; }
    
    #tree { list-style: none; padding-left: 0; margin: 0; font-size: 14px; }
    #tree ul { list-style: none; padding-left: 20px; border-left: 1px solid var(--tree-line); margin-left: 10px; }
    #tree li { margin: 4px 0; position: relative; }
    #tree li::before {
      content: ""; position: absolute; top: 12px; left: -10px;
      width: 10px; height: 1px; background: var(--tree-line);
    }
    .node-wrap { display: inline-flex; align-items: center; gap: 6px; }
    .node {
      display: inline-block; padding: 3px 6px; border: 1px solid var(--border);
      border-radius: 4px; background: var(--bg-panel); cursor: move; user-select: none;
    }
    .node.file { cursor: pointer; color: var(--primary); font-weight: bold; }
    .node.file:hover { text-decoration: underline; }
    .node-input { padding: 2px 4px; font-size: 13px; width: 120px; border: 1px solid var(--primary); outline: none; }
    .actions button { padding: 2px 6px; font-size: 11px; margin-left: 2px; }
    .over > .node-wrap > .node { background: var(--tree-hover); border-color: var(--primary); }

    /* エディタエリア */
    .main-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    
    /* タブ */
    .tabs {
      display: flex; background: var(--bg-toolbar); padding: 6px 10px 0;
      border-bottom: 1px solid var(--border); gap: 4px; overflow-x: auto;
    }
    .tab {
      background: var(--tab-bg); border: 1px solid var(--border); border-bottom: none;
      border-radius: 6px 6px 0 0; padding: 6px 12px; font-size: 13px; cursor: pointer;
      display: flex; align-items: center; gap: 6px; color: var(--text-muted);
    }
    .tab.active { background: var(--tab-active); color: var(--text-main); margin-bottom: -1px; border-bottom: 1px solid var(--tab-active); }
    .tab-close { font-size: 10px; padding: 2px; border-radius: 50%; width: 16px; height: 16px; text-align: center; line-height: 12px; }
    .tab-close:hover { background: #ff4d4d; color: white; }

    /* 2ペイン (エディタ & ビューア) */
    .panes { display: flex; flex: 1; overflow: hidden; }
    .pane { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; }
    .pane.editor-pane { border-right: 1px solid var(--border); }
    
    #editor {
      flex: 1; border: none; font-family: Consolas, Monaco, monospace;
      font-size: 14px; line-height: 1.6; background: transparent; color: var(--text-main);
      resize: none; outline: none; white-space: pre-wrap; width: 100%;
    }
    
    #viewer { font-family: "Noto Sans JP", sans-serif; font-size: 15px; line-height: 1.8; padding-right: 10px; }
    #viewer h1, #viewer h2 { border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    #viewer table { border-collapse: collapse; width: 100%; margin: 16px 0; }
    #viewer th, #viewer td { border: 1px solid var(--border); padding: 8px; }
    #viewer th { background: var(--bg-toolbar); }
    #viewer img { max-width: 100%; height: auto; border-radius: 4px; }
    #viewer blockquote { border-left: 4px solid var(--primary); padding-left: 14px; margin-left: 0; color: var(--text-muted); background: var(--bg-toolbar); padding: 8px; border-radius: 4px; }
    .empty-state { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); text-align: center; }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <h1>MD Editor Pro + Structure Map</h1>
      <button id="btn-theme">🌙 ダークモード</button>
      <select id="sel-font-size">
        <option value="14px">フォント: 小</option>
        <option value="16px" selected>フォント: 中</option>
        <option value="18px">フォント: 大</option>
      </select>
    </div>
    <div class="header-right">
      <button id="btn-download-pdf" class="btn-primary">🗺️ 構成図PDF生成</button>
      <button id="btn-download-zip" class="btn-primary">📦 ZIP保存(全ファイル)</button>
      <button id="btn-export-html">🌐 現在のタブをHTML保存</button>
    </div>
  </header>

  <div class="workspace">
    <!-- サイドバー (ファイルツリー) -->
    <aside class="sidebar">
      <div class="tree-controls">
        <button id="btn-add-folder" title="ルートにフォルダ追加">＋📁</button>
        <button id="btn-add-file" title="ルートにMDファイル追加">＋📄MD</button>
        <button id="btn-add-txt" title="ルートにTXTファイル追加">＋📄TXT</button>
        <div style="width:100%; height:4px;"></div>
        <button id="btn-undo" disabled>↩️ Undo</button>
        <button id="btn-redo" disabled>↪️ Redo</button>
        <div style="width:100%; height:4px;"></div>
        <button id="btn-import-fs">📂 フォルダ読込</button>
        <button id="btn-load-csv">📥 CSV読込</button>
        <button id="btn-save-csv">📤 CSV保存</button>
      </div>
      <div class="tree-container">
        <ul id="tree"></ul>
      </div>
    </aside>

    <!-- メインエリア -->
    <main class="main-area">
      <div class="tabs" id="tabs-container"></div>
      <div class="panes" id="panes-container">
        <div class="empty-state" id="empty-state">
          左のツリーからファイルを選択するか、<br>新しいファイルを作成して編集を開始してください。
        </div>
        <div class="pane editor-pane" id="editor-container" style="display:none;">
          <textarea id="editor" placeholder="ここにMarkdownやコードを入力..."></textarea>
        </div>
        <div class="pane" id="viewer-container" style="display:none;">
          <div id="viewer"></div>
        </div>
      </div>
    </main>
  </div>

  <script>
    /* =========================================
       1. ライブラリ初期設定
       ========================================= */
    mermaid.initialize({ startOnLoad: false, theme: 'default' });

    marked.setOptions({
      highlight: function(code, lang) {
        if (lang === 'mermaid') return `<div class="mermaid">${code}</div>`;
        if (lang && hljs.getLanguage(lang)) return hljs.highlight(code, { language: lang }).value;
        return hljs.highlightAuto(code).value;
      },
      breaks: true,
      gfm: true
    });

    /* =========================================
       2. データ構造・状態管理
       ========================================= */
    let idCounter = 1;
    function genId() { return 'n' + (idCounter++); }
    function createNode(name, type) { 
      // ファイルの初期テンプレート
      let content = '';
      if(type === 'file' && name.endsWith('.html')){
        content = `<!DOCTYPE html>\n<html lang="ja">\n<head><meta charset="UTF-8"><title>${name}</title></head>\n<body>\n\n</body>\n</html>`;
      } else if (type === 'file' && (name.endsWith('.md') || !name.includes('.'))) {
        content = `# ${name}\nここに内容を記述します。`;
      }
      return { id: genId(), name, type, children: [], content }; 
    }

    let root = createNode('/', 'folder');
    let editingId = null;
    let openTabs = [];     // { id, node }
    let activeTabId = null;

    // Undo/Redo 履歴
    let historyStack = [];
    let futureStack = [];

    function saveHistory() {
      historyStack.push(JSON.stringify(root));
      if (historyStack.length > 50) historyStack.shift();
      futureStack = [];
      updateUndoRedoBtn();
    }

    function undo() {
      if (historyStack.length === 0) return;
      futureStack.push(JSON.stringify(root));
      root = JSON.parse(historyStack.pop());
      updateMaxId(); renderTree(); updateUndoRedoBtn();
      syncTabsWithTree();
    }

    function redo() {
      if (futureStack.length === 0) return;
      historyStack.push(JSON.stringify(root));
      root = JSON.parse(futureStack.pop());
      updateMaxId(); renderTree(); updateUndoRedoBtn();
      syncTabsWithTree();
    }

    function updateMaxId() {
      let max = 0;
      function walk(n) {
        const num = parseInt(n.id.replace('n', ''), 10);
        if (num > max) max = num;
        n.children.forEach(walk);
      }
      walk(root);
      idCounter = max + 1;
    }

    function updateUndoRedoBtn() {
      document.getElementById('btn-undo').disabled = historyStack.length === 0;
      document.getElementById('btn-redo').disabled = futureStack.length === 0;
    }

    function findNode(p, id) {
      if (p.id === id) return p;
      for (const c of p.children) { const r = findNode(c, id); if (r) return r; }
      return null;
    }

    function findParent(p, id) {
      for (const c of p.children) {
        if (c.id === id) return p;
        const r = findParent(c, id);
        if (r) return r;
      }
      return null;
    }

    function removeNode(p, id) {
      p.children = p.children.filter(c => c.id !== id);
      p.children.forEach(c => removeNode(c, id));
    }

    /* =========================================
       3. ツリー UI描画・操作
       ========================================= */
    function renderTree() {
      const ul = document.getElementById('tree');
      ul.innerHTML = '';

      function build(node, container) {
        node.children.forEach(ch => {
          const li = document.createElement('li');
          li.draggable = true;
          li.dataset.id = ch.id;

          const wrap = document.createElement('div');
          wrap.className = 'node-wrap';

          if (ch.id === editingId) {
            const inp = document.createElement('input');
            inp.value = ch.name; inp.className = 'node-input';
            inp.onblur = () => commitEdit(inp.value);
            inp.onkeydown = e => { if (e.key === 'Enter') inp.blur(); };
            wrap.appendChild(inp);
            setTimeout(() => inp.select(), 0);
          } else {
            const sp = document.createElement('span');
            sp.className = `node ${ch.type}`;
            sp.textContent = (ch.type === 'folder' ? '📁 ' : '📄 ') + ch.name;
            
            // 編集モードへの移行 (ダブルクリック)
            sp.ondblclick = (e) => { e.stopPropagation(); editingId = ch.id; renderTree(); };
            
            // ファイルを開く (シングルクリック)
            if (ch.type === 'file') {
              sp.onclick = (e) => { e.stopPropagation(); openTab(ch.id); };
            }
            wrap.appendChild(sp);
          }

          const act = document.createElement('span');
          act.className = 'actions';
          const btns = [
            { t: '✎', fn: () => { editingId = ch.id; renderTree(); } },
            { t: '+📁', fn: () => { saveHistory(); ch.children.push(createNode('new-folder', 'folder')); renderTree(); }, cond: ch.type === 'folder' },
            { t: '+📄', fn: () => { saveHistory(); ch.children.push(createNode('new-file.md', 'file')); renderTree(); }, cond: ch.type === 'folder' },
            { t: '✕', fn: () => { saveHistory(); removeNode(root, ch.id); syncTabsWithTree(); renderTree(); } }
          ];
          btns.forEach(b => {
            if (b.cond === false) return;
            const btn = document.createElement('button');
            btn.textContent = b.t;
            btn.onclick = (e) => { e.stopPropagation(); b.fn(); };
            act.appendChild(btn);
          });
          wrap.appendChild(act);
          li.appendChild(wrap);

          // ドラッグ＆ドロップイベント
          li.addEventListener('dragstart', onDragStart);
          li.addEventListener('dragover', onDragOver);
          li.addEventListener('dragleave', onDragLeave);
          li.addEventListener('drop', onDrop);

          container.appendChild(li);

          if (ch.type === 'folder') {
            const sub = document.createElement('ul');
            li.appendChild(sub);
            build(ch, sub);
          }
        });
      }
      build(root, ul);
      saveToLocalStorage(); // ツリー更新時に保存
    }

    function commitEdit(val) {
      if (val.trim()) {
        saveHistory();
        findNode(root, editingId).name = val.trim();
      }
      editingId = null;
      renderTree();
      renderTabs(); // タブ名も同期
    }

    /* --- ドラッグ＆ドロップ処理 --- */
    let draggedId = null;
    function onDragStart(e) { draggedId = e.currentTarget.dataset.id; e.stopPropagation(); }
    function onDragOver(e) {
      e.preventDefault(); e.stopPropagation();
      const n = findNode(root, e.currentTarget.dataset.id);
      if (n && n.type === 'folder') e.currentTarget.classList.add('over');
    }
    function onDragLeave(e) { e.currentTarget.classList.remove('over'); e.stopPropagation(); }
    function onDrop(e) {
      e.preventDefault(); e.stopPropagation();
      e.currentTarget.classList.remove('over');
      const tgt = e.currentTarget.dataset.id;
      if (!draggedId || tgt === draggedId) return;
      const sp = findParent(root, draggedId);
      const sn = findNode(root, draggedId);
      const tn = findNode(root, tgt);
      if (tn && tn.type === 'folder' && !isDescendant(sn, tn)) {
        saveHistory();
        sp.children = sp.children.filter(c => c.id !== draggedId);
        tn.children.push(sn);
        renderTree();
      }
    }
    function isDescendant(parent, child) {
      if (parent.id === child.id) return true;
      for (let c of parent.children) { if (isDescendant(c, child)) return true; }
      return false;
    }

    /* =========================================
       4. エディタ・タブ管理
       ========================================= */
    const editorEl = document.getElementById('editor');
    const viewerEl = document.getElementById('viewer');

    function syncTabsWithTree() {
      // 削除されたノードがタブに残らないようにする
      openTabs = openTabs.filter(tab => findNode(root, tab.id));
      if (!findNode(root, activeTabId)) {
        activeTabId = openTabs.length > 0 ? openTabs[0].id : null;
      }
      renderTabs();
      updateEditorView();
    }

    function openTab(nodeId) {
      const node = findNode(root, nodeId);
      if (!node || node.type !== 'file') return;
      if (!openTabs.find(t => t.id === nodeId)) {
        openTabs.push(node);
      }
      activeTabId = nodeId;
      renderTabs();
      updateEditorView();
    }

    function closeTab(nodeId, e) {
      e.stopPropagation();
      openTabs = openTabs.filter(t => t.id !== nodeId);
      if (activeTabId === nodeId) {
        activeTabId = openTabs.length > 0 ? openTabs[openTabs.length - 1].id : null;
      }
      renderTabs();
      updateEditorView();
    }

    function renderTabs() {
      const container = document.getElementById('tabs-container');
      container.innerHTML = '';
      openTabs.forEach(node => {
        const div = document.createElement('div');
        div.className = `tab ${node.id === activeTabId ? 'active' : ''}`;
        div.innerHTML = `<span>${node.name}</span> <span class="tab-close">✕</span>`;
        div.onclick = () => { activeTabId = node.id; renderTabs(); updateEditorView(); };
        div.querySelector('.tab-close').onclick = (e) => closeTab(node.id, e);
        container.appendChild(div);
      });
    }

    function updateEditorView() {
      const emptyState = document.getElementById('empty-state');
      const edCont = document.getElementById('editor-container');
      const viCont = document.getElementById('viewer-container');

      if (!activeTabId) {
        emptyState.style.display = 'flex';
        edCont.style.display = 'none';
        viCont.style.display = 'none';
        editorEl.value = '';
        viewerEl.innerHTML = '';
        return;
      }

      emptyState.style.display = 'none';
      edCont.style.display = 'flex';
      viCont.style.display = 'block';

      const node = findNode(root, activeTabId);
      editorEl.value = node.content || '';
      compilePreview(node.content);
    }

    // エディタ入力時
    editorEl.addEventListener('input', () => {
      if (activeTabId) {
        const node = findNode(root, activeTabId);
        if (node) {
          node.content = editorEl.value;
          compilePreview(editorEl.value);
          saveToLocalStorage(); // テキスト入力時は即時ローカル保存（履歴には積まない）
        }
      }
    });

    // スクロール同期
    let isSyncingLeft = false, isSyncingRight = false;
    const viCont = document.getElementById('viewer-container');
    editorEl.addEventListener('scroll', () => {
      if (!isSyncingLeft) {
        isSyncingRight = true;
        const percentage = editorEl.scrollTop / (editorEl.scrollHeight - editorEl.clientHeight);
        viCont.scrollTop = percentage * (viCont.scrollHeight - viCont.clientHeight);
      }
      isSyncingLeft = false;
    });
    viCont.addEventListener('scroll', () => {
      if (!isSyncingRight) {
        isSyncingLeft = true;
        const percentage = viCont.scrollTop / (viCont.scrollHeight - viCont.clientHeight);
        editorEl.scrollTop = percentage * (editorEl.scrollHeight - editorEl.clientHeight);
      }
      isSyncingRight = false;
    });

    // プレビュー コンパイル
    function compilePreview(text) {
      let html = marked.parse(text || '');
      viewerEl.innerHTML = html;
      
      // KaTeX
      renderMathInElement(viewerEl, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false}
        ]
      });

      // Mermaid
      mermaid.run({ nodes: document.querySelectorAll('.mermaid') }).catch(e=>console.log(e));
    }

    // 画像ペースト (Base64)
    editorEl.addEventListener('paste', e => {
      const items = (e.clipboardData || window.clipboardData).items;
      for (let item of items) {
        if (item.type.indexOf('image') === 0) {
          e.preventDefault();
          const file = item.getAsFile();
          const reader = new FileReader();
          reader.onload = event => {
            const base64 = event.target.result;
            const cursorStart = editorEl.selectionStart;
            const text = editorEl.value;
            const imgTag = `\n![Pasted Image](${base64})\n`;
            editorEl.value = text.substring(0, cursorStart) + imgTag + text.substring(editorEl.selectionEnd);
            editorEl.selectionStart = editorEl.selectionEnd = cursorStart + imgTag.length;
            
            const node = findNode(root, activeTabId);
            if(node) node.content = editorEl.value;
            compilePreview(editorEl.value);
            saveToLocalStorage();
          };
          reader.readAsDataURL(file);
        }
      }
    });

    /* =========================================
       5. ツールバーアクション・エクスポート
       ========================================= */
    // ダークモード
    document.getElementById('btn-theme').onclick = () => {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      document.getElementById('btn-theme').innerText = isDark ? '☀️ ライトモード' : '🌙 ダークモード';
      document.getElementById('hljs-theme-light').disabled = isDark;
      document.getElementById('hljs-theme-dark').disabled = !isDark;
      mermaid.initialize({ theme: isDark ? 'dark' : 'default' });
      if(activeTabId) compilePreview(editorEl.value);
    };

    // フォントサイズ
    document.getElementById('sel-font-size').onchange = e => {
      editorEl.style.fontSize = e.target.value;
      viewerEl.style.fontSize = (parseInt(e.target.value) + 1) + 'px';
    };

    // ツリーコントロールボタン
    document.getElementById('btn-add-folder').onclick = () => { saveHistory(); root.children.push(createNode('new-folder', 'folder')); renderTree(); };
    document.getElementById('btn-add-file').onclick = () => { saveHistory(); root.children.push(createNode('new-file.md', 'file')); renderTree(); };
    document.getElementById('btn-add-txt').onclick = () => { saveHistory(); root.children.push(createNode('new-file.txt', 'file')); renderTree(); };
    document.getElementById('btn-undo').onclick = undo;
    document.getElementById('btn-redo').onclick = redo;

    // CSV保存
    document.getElementById('btn-save-csv').onclick = () => {
      const rows=[['path','type']];
      (function w(n,p){
        n.children.forEach(c=>{
          const path = p + '/' + c.name;
          rows.push([path, c.type]);
          if(c.type==='folder') w(c, path);
        });
      })(root, '');
      const csv = rows.map(r=>r.join(',')).join('\n');
      const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
      const blob = new Blob([bom, csv], {type:'text/csv'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'structure.csv'; a.click();
    };

    // CSV読込
    document.getElementById('btn-load-csv').onclick = async () => {
      try {
        const [f] = await window.showOpenFilePicker({types:[{accept:{'text/csv':['.csv']}}]});
        const txt = await (await f.getFile()).text();
        const lines = txt.split('\n').slice(1).filter(l=>l.trim());
        saveHistory();
        root = createNode('/', 'folder');
        lines.forEach(l => {
          const idx = l.lastIndexOf(',');
          const path = l.slice(0, idx);
          const type = l.slice(idx+1).trim();
          const seg = path.split('/').filter(Boolean);
          let p = root;
          seg.forEach((n, i) => {
            const last = i === seg.length-1;
            if(last && type==='file') p.children.push(createNode(n, 'file'));
            else {
              let d = p.children.find(c => c.name===n && c.type==='folder');
              if(!d){ d = createNode(n, 'folder'); p.children.push(d); }
              p = d;
            }
          });
        });
        updateMaxId(); syncTabsWithTree(); renderTree();
      } catch(e) { console.error(e); }
    };

    // フォルダ(FS)読込
    document.getElementById('btn-import-fs').onclick = async () => {
      try {
        const dh = await window.showDirectoryPicker();
        saveHistory();
        idCounter = 1;
        async function readFs(dh) {
          const node = createNode(dh.name, 'folder');
          for await(const [name, ent] of dh.entries()) {
            if(ent.kind === 'directory') node.children.push(await readFs(ent));
            else node.children.push(createNode(name, 'file'));
          }
          return node;
        }
        root = await readFs(dh);
        syncTabsWithTree(); renderTree();
      } catch(e) { console.error(e); }
    };

    // ZIPダウンロード (JSZip)
    document.getElementById('btn-download-zip').onclick = () => {
      const zip = new JSZip();
      (async function add(n, f) {
        for(const c of n.children) {
          if(c.type === 'folder') await add(c, f.folder(c.name));
          else f.file(c.name, c.content || '');
        }
      })(root, zip).then(() => {
        zip.generateAsync({type:'blob'}).then(b => {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(b); a.download = 'project_files.zip'; a.click();
        });
      });
    };

    // 現在のタブをHTML保存
    document.getElementById('btn-export-html').onclick = () => {
      if(!activeTabId) return alert('開いているファイルがありません。');
      const node = findNode(root, activeTabId);
      const htmlContent = `
        <!DOCTYPE html>
        <html><head><meta charset="utf-8"><title>${node.name}</title>
        <style>body{font-family: sans-serif; line-height: 1.6; padding: 40px; max-width: 900px; margin: auto;}</style>
        </head><body>${viewerEl.innerHTML}</body></html>`;
      const blob = new Blob([htmlContent], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = `${node.name}.html`; a.click();
    };

    // 豪華構成図PDF (Canvas描画 → jsPDF)
    document.getElementById('btn-download-pdf').onclick = () => {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({unit:'pt', format:'a4'});
      const w = pdf.internal.pageSize.getWidth(), h = pdf.internal.pageSize.getHeight();
      const margin = 40, nodeH = 35, indentX = 130, spaceY = 20;
      const palette = ['#FF6B6B','#6BCB77','#4D96FF','#FFD93D','#845EC2','#00C9A7'];
      const counts = {}, all = [];

      function layout(n, d=0) {
        if(!counts[d]) counts[d]=0;
        n.depth = d;
        n.x = margin + d * indentX;
        n.y = margin + counts[d] * (nodeH + spaceY) + (d===0 ? 0 : 50);
        counts[d]++;
        all.push(n);
        n.children.forEach(c => layout(c, d+1));
      }
      layout(root);

      const cv = document.createElement('canvas');
      // 高さ自動拡張
      const maxH = Math.max(h, (Math.max(...Object.values(counts)) * (nodeH + spaceY)) + 150);
      cv.width = w; cv.height = maxH;
      const ctx = cv.getContext('2d');
      ctx.textBaseline = 'middle';

      // 背景
      const grad = ctx.createLinearGradient(0,0,0,maxH);
      grad.addColorStop(0,'#f0f4f8'); grad.addColorStop(1,'#e0e7ef');
      ctx.fillStyle = grad; ctx.fillRect(0,0,w,maxH);

      // 線
      ctx.save();
      ctx.strokeStyle = '#888'; ctx.lineWidth = 2;
      all.forEach(n => {
        n.children.forEach(c => {
          const x1 = n.x + 100, y1 = n.y + nodeH/2;
          const x2 = c.x, y2 = c.y + nodeH/2;
          const cx = (x1+x2)/2, cy = (y1+y2)/2 - 20;
          ctx.beginPath(); ctx.moveTo(x1, y1);
          ctx.bezierCurveTo(cx, cy, cx, cy, x2, y2); ctx.stroke();
        });
      });
      ctx.restore();

      // ノード描画ヘルパー
      function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath(); ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y);
        ctx.quadraticCurveTo(x+w, y, x+w, y+r); ctx.lineTo(x+w, y+h-r);
        ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h); ctx.lineTo(x+r, y+h);
        ctx.quadraticCurveTo(x, y+h, x, y+h-r); ctx.lineTo(x, y+r);
        ctx.quadraticCurveTo(x, y, x+r, y); ctx.closePath();
      }

      all.forEach(n => {
        const col = palette[n.depth % palette.length];
        const txt = n.name;
        ctx.font = 'bold 14px sans-serif';
        const tw = ctx.measureText(txt).width;
        const bw = Math.max(tw + 45, 100);
        
        ctx.save();
        ctx.shadowColor = "rgba(0,0,0,0.15)"; ctx.shadowBlur = 6;
        ctx.fillStyle = col;
        roundRect(ctx, n.x, n.y, bw, nodeH, 8);
        ctx.fill();
        ctx.restore();

        ctx.fillStyle = '#fff';
        ctx.textAlign = 'left';
        ctx.fillText(txt, n.x + 35, n.y + nodeH/2);

        // シンプルなアイコン描画
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        if(n.type === 'folder') {
          ctx.fillRect(n.x + 10, n.y + 12, 16, 12);
        } else {
          ctx.fillRect(n.x + 12, n.y + 10, 12, 16);
        }
      });

      const img = cv.toDataURL('image/png');
      
      // PDFが高さを超える場合はページを分割せずにA4比率で圧縮か、長いPDFにする
      // ここでは簡易的に1ページに圧縮して収める
      const pdfPdf = new jsPDF({unit:'pt', format:[w, maxH]});
      pdfPdf.addImage(img, 'PNG', 0, 0, w, maxH);
      pdfPdf.save('structure_map.pdf');
    };

    /* =========================================
       6. 自動保存 (LocalStorage)
       ========================================= */
    function saveToLocalStorage() {
      localStorage.setItem('ide_tree', JSON.stringify(root));
      localStorage.setItem('ide_open_tabs', JSON.stringify(openTabs.map(t=>t.id)));
      localStorage.setItem('ide_active_tab', activeTabId);
    }

    function loadFromLocalStorage() {
      const savedTree = localStorage.getItem('ide_tree');
      if (savedTree) {
        root = JSON.parse(savedTree);
        updateMaxId();
        
        const savedTabs = JSON.parse(localStorage.getItem('ide_open_tabs') || '[]');
        openTabs = [];
        savedTabs.forEach(id => {
          const n = findNode(root, id);
          if(n) openTabs.push(n);
        });
        
        const savedActive = localStorage.getItem('ide_active_tab');
        activeTabId = findNode(root, savedActive) ? savedActive : (openTabs.length ? openTabs[0].id : null);
      } else {
        // 初期サンプルデータ
        root = createNode('/', 'folder');
        const src = createNode('src', 'folder');
        const readme = createNode('README.md', 'file');
        readme.content = '# プロジェクト\nこれはサンプルです。\n\n```mermaid\ngraph TD;\n A-->B;\n```';
        root.children.push(src, readme);
        updateMaxId();
      }
      renderTree();
      renderTabs();
      updateEditorView();
    }

    // アプリ起動
    loadFromLocalStorage();

  </script>
</body>
</html>
